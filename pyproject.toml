[project]
name = "grid-load-agent"
version = "0.1.0"
description = "AGH-based electricity load forecasting & anomaly detection closed-loop"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "requests>=2.31",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# 显式声明包，避免 setuptools 在 flat-layout 下误把 data/runs 等目录当成包
[tool.setuptools]
packages = ["harness", "tools"]

[tool.setuptools.package-dir]
"" = "."
